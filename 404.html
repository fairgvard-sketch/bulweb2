<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>404 — Bulochka</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
  <script>(function(){var l=localStorage.getItem('bulochka-lang')||'he';if(l==='he'){document.documentElement.dir='rtl';document.documentElement.lang='he';}else{document.documentElement.lang=l;}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400&family=Inter+Tight:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
  <style>
    body { padding-top: 0; }
    .nf-wrap {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      gap: 0;
    }
    .nf-logo { height: 44px; width: auto; margin-bottom: 40px; }
    .nf-code {
      font-family: var(--serif);
      font-size: clamp(96px, 20vw, 180px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--brown-dark);
      font-optical-sizing: auto;
    }
    .nf-code em { font-style: italic; color: var(--gold-deep); }
    .nf-msg {
      font-family: var(--serif);
      font-size: clamp(17px, 2.2vw, 22px);
      font-weight: 300;
      font-style: italic;
      color: var(--brown-mid);
      margin: 18px 0 40px;
      max-width: 420px;
      line-height: 1.6;
    }
    [dir="rtl"] .nf-msg { font-style: normal; }
    .nf-ctas { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .nf-btn {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 14px 32px;
      border-radius: var(--radius-pill);
      transition: opacity 0.2s, background 0.2s, color 0.2s;
    }
    .nf-btn-primary { background: var(--brown-dark); color: var(--cream); }
    .nf-btn-primary:hover { opacity: 0.85; }
    .nf-btn-outline { border: 1px solid var(--brown-dark); color: var(--brown-dark); }
    .nf-btn-outline:hover { background: var(--brown-dark); color: var(--cream); }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <a href="index.html"><img src="img/Main page/logotip_crop_hq.png" alt="Bulochka" class="nf-logo"></a>
    <div class="nf-code">4<em>0</em>4</div>
    <p class="nf-msg" data-en="Looks like this bun is sold out. The page you're after doesn't exist." data-he="נראה שהלחמנייה הזאת אזלה. העמוד שחיפשת לא קיים." data-ru="Похоже, эта булочка закончилась. Такой страницы нет.">Looks like this bun is sold out. The page you're after doesn't exist.</p>
    <div class="nf-ctas">
      <a href="index.html" class="nf-btn nf-btn-primary" data-en="Back home" data-he="לעמוד הראשי" data-ru="На главную">Back home</a>
      <a href="menu.html" class="nf-btn nf-btn-outline" data-en="See the menu" data-he="לתפריט" data-ru="В меню">See the menu</a>
    </div>
  </main>
  <script>
    // применяем сохранённый язык к data-атрибутам (упрощённый lang.js)
    (function () {
      var lang = localStorage.getItem('bulochka-lang') || 'he';
      if (lang === 'en') return;
      document.querySelectorAll('[data-he]').forEach(function (el) {
        var val = lang === 'he' ? el.dataset.he : el.dataset.ru;
        if (val) el.textContent = val;
      });
    })();
  </script>
</body>
</html>
